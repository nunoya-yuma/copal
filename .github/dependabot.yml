version: 2
updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      cargo-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # rmcp is a transitive dependency of rig-core, which currently pins it
      # to ^0.13. A direct major bump breaks the build with two incompatible
      # rmcp versions in the dependency graph (see PR #144). Bump rmcp only
      # together with a compatible rig-core upgrade.
      - dependency-name: "rmcp"
        update-types: ["version-update:semver-major"]

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci):"
    groups:
      github-actions-patch-minor:
        update-types:
          - "minor"
          - "patch"
