version: 2
updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      cargo-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # rmcp is a transitive dependency of rig-core, which currently pins it
      # to ^0.13. A direct major bump breaks the build with two incompatible
      # rmcp versions in the dependency graph (see closed PR #144). Bump rmcp
      # only together with a compatible rig-core upgrade. Tracked in #146.
      - dependency-name: "rmcp"
        update-types: ["version-update:semver-major"]

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7.x is a native Go-compiler rewrite that breaks typecheck
      # here and is not yet supported by typescript-eslint/ESLint/ts-jest
      # (see closed PR #129). Revisit once the ecosystem catches up.
      # Tracked in #147.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci):"
    groups:
      github-actions-patch-minor:
        update-types:
          - "minor"
          - "patch"
