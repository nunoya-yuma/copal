name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nunoya-yuma/copal
  CONTAINER_APP_NAME: copal-app
  RESOURCE_GROUP: copal-rg

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    needs: test  # Only deploy if tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update secrets in Azure Container Apps
        run: |
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              llm-provider="${{ secrets.LLM_PROVIDER }}" \
              openai-api-key="${{ secrets.OPENAI_API_KEY }}" \
              gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
              tavily-api-key="${{ secrets.TAVILY_API_KEY }}" \
              copal-api-token="${{ secrets.COPAL_API_TOKEN }}"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars \
              LLM_PROVIDER=secretref:llm-provider \
              OPENAI_API_KEY=secretref:openai-api-key \
              GEMINI_API_KEY=secretref:gemini-api-key \
              TAVILY_API_KEY=secretref:tavily-api-key \
              COPAL_API_TOKEN=secretref:copal-api-token
